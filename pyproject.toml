[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streetview-3d-builder"
version = "0.1.0"
description = "Resumable panorama-to-COLMAP-to-3DGS reconstruction pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "Pillow>=10.0",
  "transformers>=4.55,<5",
  "safetensors>=0.5",
]

[project.optional-dependencies]
mask = ["ultralytics>=8.3"]
dev = ["pytest>=8"]

[project.scripts]
street3d = "street3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
